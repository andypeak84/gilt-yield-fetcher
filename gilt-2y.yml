name: Update UK 2Y Gilt Yield

on:
  schedule:
    - cron: '0 13 * * 1-5'  # 1pm UTC, weekdays (after BoE's noon publish)
  workflow_dispatch:  # lets you trigger manually to test

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests openpyxl
      - run: python scripts/fetch_gilt.py
      - run: |
          git config user.name "gilt-bot"
          git config user.email "actions@github.com"
          git add data/gilt-2y.json
          git commit -m "Update 2Y gilt yield" || echo "No changes"
          git push
