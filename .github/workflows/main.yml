name: Update UK 2Y Gilt Yield

on:
  schedule:
    - cron: '0 13 * * 1-5'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests openpyxl

      - name: Fetch gilt yield
        run: python scripts/fetch_gilt.py

      - name: Commit and push
        run: |
          git config user.name "gilt-bot"
          git config user.email "actions@github.com"
          git add data/gilt-2y.json
          git commit -m "Update 2Y gilt yield" || echo "No changes to commit"
          git push
